<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Portal Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 40px 34px;
      width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { font-size: 1.8rem; color: #fff; font-weight: 700; }
    .logo span { color: #fff; }
    .logo p { color: #ddd; font-size: 0.9rem; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; color: #ddd; font-size: 0.875rem; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      transition: border-color 0.15s, background 0.15s;
      outline: none;
    }
    input::placeholder { color: #8b8b8b; }
    input:focus { border-color: #fff; background: #111; }
    .btn-login {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s, transform 0.08s;
    }
    .btn-login:hover { opacity: 0.95; transform: translateY(-1px); }
    #errorMsg { color: #f8f8f8; font-size: 0.85rem; margin-top: 12px; text-align: center; min-height: 20px; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1><span>Student</span> Portal</h1>
      <p>Sign in to access your dashboard</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter username"
        />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
        />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Login</button>
      <p id="errorMsg"></p>
    </form>
  </div>

  <script>
    const VALID_USERNAME = 'student';
    const VALID_PASSWORD = 'Student@123';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      if (!username) {
        errorMsg.textContent = 'Username is required';
        return;
      }
      if (!password) {
        errorMsg.textContent = 'Password is required';
        return;
      }
      if (username !== VALID_USERNAME) {
        errorMsg.textContent = 'Invalid username';
        return;
      }
      if (password !== VALID_PASSWORD) {
        errorMsg.textContent = 'Invalid password';
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
