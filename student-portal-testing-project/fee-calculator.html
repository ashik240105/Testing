<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Course Fee Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; min-height: 100vh; }
    nav {
      background: #0b0b0b;
      border-bottom: 1px solid #222;
      padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .appName { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .nav-links a { color: #ddd; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; transition: background 0.15s; }
    .nav-links a:hover { background: #222; color: #fff; }

    .page-wrapper { display: flex; justify-content: center; padding: 48px 16px; }
    .form-card {
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.6);
    }
    .form-card h1 { font-size: 1.6rem; font-weight: 700; color: #fff; margin-bottom: 22px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; color: #ddd; font-size: 0.875rem; margin-bottom: 6px; font-weight: 500; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input::placeholder { color: #8b8b8b; }
    input:focus, select:focus { border-color: #fff; }
    select option { background: #111; color: #fff; }

    .btn-calc {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    .btn-calc:hover { opacity: 0.95; }

    #fcErrorMsg { color: #f8f8f8; font-size: 0.85rem; margin-top: 12px; text-align: center; min-height: 20px; }
    #resultBox {
      display: none;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      text-align: center;
    }
    #resultBox p { color: #ddd; font-size: 1.1rem; font-weight: 700; }
  </style>
</head>
<body>

  <nav>
    <span class="appName">Student Portal</span>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="index.html">Logout</a>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="form-card">
      <h1>Course Fee Calculator</h1>
      <form id="feeForm" novalidate>

        <div class="form-group">
          <label for="courseSelect">Select Course</label>
          <select id="courseSelect" name="courseSelect">
            <option value="">-- Select a Course --</option>
            <option value="30000">Java Full Stack (Rs.30000)</option>
            <option value="25000">Software Testing (Rs.25000)</option>
            <option value="35000">Data Science (Rs.35000)</option>
            <option value="20000">Python (Rs.20000)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="discount">Discount Percentage</label>
          <input type="text" id="discount" name="discount" placeholder="Enter discount percentage" />
        </div>

        <button type="submit" class="btn-calc" id="calculateFee">Calculate Fee</button>
        <p id="fcErrorMsg"></p>

        <div id="resultBox">
          <p id="fcResult"></p>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('feeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const errorMsg = document.getElementById('fcErrorMsg');
      const resultBox = document.getElementById('resultBox');
      errorMsg.textContent = '';
      resultBox.style.display = 'none';

      const courseVal = document.getElementById('courseSelect').value;
      const discountVal = document.getElementById('discount').value.trim();

      if (!courseVal) { errorMsg.textContent = 'Course is required'; return; }
      if (!discountVal) { errorMsg.textContent = 'Discount is required'; return; }
      if (isNaN(discountVal) || discountVal === '') { errorMsg.textContent = 'Discount should be a number'; return; }

      const discountNum = parseFloat(discountVal);
      if (isNaN(discountNum) && isNaN(Number(discountVal))) { errorMsg.textContent = 'Discount should be a number'; return; }
      // Alphabetic check
      if (/[a-zA-Z]/.test(discountVal)) { errorMsg.textContent = 'Discount should be a number'; return; }
      if (discountNum < 0 || discountNum > 50) { errorMsg.textContent = 'Discount should be between 0 and 50'; return; }

      const baseFee = parseFloat(courseVal);
      const finalFee = baseFee - (baseFee * discountNum / 100);
      document.getElementById('fcResult').textContent = `Final Fee: Rs.${finalFee}`;
      resultBox.style.display = 'block';
    });
  </script>
</body>
</html>
